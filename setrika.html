<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satu Hub • Kasir Jasa Setrika</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 20px auto; padding: 0 14px; line-height: 1.45; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .row-btn { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button { padding: 9px 12px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; border-radius: 6px; margin-top: 14px; }
    #qrisArea { margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Kasir & Verifikasi Jasa Setrika</h2>

  <label for="orderId">ID Order</label>
  <input id="orderId" type="text" placeholder="ORD-001" />

  <label for="beratKg">Berat Aktual (kg)</label>
  <input id="beratKg" type="number" step="0.1" value="3.5" />

  <label for="tarifKg">Tarif / kg (Rp)</label>
  <input id="tarifKg" type="number" value="6000" />

  <label for="paymentMethod">Metode Pembayaran</label>
  <select id="paymentMethod">
    <option value="cash">Cash (Tunai)</option>
    <option value="qris">QRIS Statis (Zeevanna Digi &amp; Krea...)</option>
  </select>

  <div id="operatorBox">
  <label for="opPenyetrika">Penyetrika</label>
  <input id="opPenyetrika" type="text" placeholder="Nama / Tim Penyetrika" value="Tim Setrika" />

  <label for="opKurir">Kurir</label>
  <input id="opKurir" type="text" placeholder="Nama / Tim Kurir" value="Tim Kurir" />

  <label for="opAdmin">Admin</label>
  <input id="opAdmin" type="text" placeholder="Nama Admin Kasir" value="Admin Kasir" />

  <label for="opPic">PIC</label>
  <input id="opPic" type="text" placeholder="Nama PIC Lapangan" value="PIC Lapangan" />
</div>

<div id="cashBox">
    <label for="cashReceived">Uang Diterima Cash (Rp)</label>
    <input id="cashReceived" type="number" value="25000" />
  </div>

  <div class="row-btn">
    <button id="btnHitung" type="button">Hitung Billing</button>
    <button id="btnStruk" type="button">Buat Struk</button>
    <button id="btnSimpanLunas" type="button">Simpan &amp; Tandai Lunas</button>
  </div>

  <div id="qrisArea"></div>
  <pre id="outputBox">Siap memproses order jasa setrika.</pre>

  <script src="./portal/asas-upgrade.js"></script>
  <script type="module">
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db, ensureCustomerAuth } from "./firebase-config.js";

    const PORSI = { kasir: 15, operasional: 25, pusat: 60 };
    const QRIS_INFO = {
      merchant: "Zeevanna Digi & Krea...",
      nmid: "ID1026556910978",
      terminal: "A01",
      imageSrc: "./assets/qris-zeevanna.jpg"
    };

    const paymentSelect = document.getElementById("paymentMethod");
    const cashBox = document.getElementById("cashBox");
    const qrisArea = document.getElementById("qrisArea");
    const outputBox = document.getElementById("outputBox");

    function hitungBagiHasil(totalMasuk, porsi = PORSI) {
      const nominal = Math.max(0, Math.round(Number(totalMasuk || 0)));
      const kasir = Math.round((nominal * Number(porsi.kasir || 0)) / 100);
      const operasional = Math.round((nominal * Number(porsi.operasional || 0)) / 100);
      const pusat = Math.max(0, nominal - kasir - operasional);
      return { totalMasuk: nominal, kasir, operasional, pusat, porsi };
    }

    function getOrderData() {
      const orderId = document.getElementById("orderId").value.trim();
      const beratKg = Number(document.getElementById("beratKg").value || 0);
      const tarifKg = Number(document.getElementById("tarifKg").value || 0);
      const totalBilling = Math.round(beratKg * tarifKg);
      const paymentMethod = paymentSelect.value;
      const cashReceived = Number(document.getElementById("cashReceived").value || 0);

      let paidAmount = totalBilling;
      let changeAmount = 0;

      if (paymentMethod === "cash") {
        if (cashReceived < totalBilling) {
          throw new Error("Uang cash kurang dari total tagihan (Rp " + totalBilling.toLocaleString("id-ID") + ").");
        }
        changeAmount = Math.round(cashReceived - totalBilling);
      }

      const bagiHasil = hitungBagiHasil(paidAmount, PORSI);
      return {
        orderId,
        beratKg,
        tarifKg,
        totalBilling,
        paymentMethod,
        cashReceived: paymentMethod === "cash" ? Math.round(cashReceived) : paidAmount,
        changeAmount,
        paidAmount,
        bagiHasil
      };
    }

    function renderPaymentHelper() {
      const { totalBilling } = (() => {
        const b = Number(document.getElementById("beratKg").value || 0);
        const t = Number(document.getElementById("tarifKg").value || 0);
        return { totalBilling: Math.round(b * t) };
      })();

      if (paymentSelect.value === "cash") {
        cashBox.style.display = "block";
        qrisArea.innerHTML = "";
      } else {
        cashBox.style.display = "none";
        qrisArea.innerHTML =
          "<div><strong>Pembayaran QRIS • Tagihan: Rp " + totalBilling.toLocaleString("id-ID") + "</strong></div>" +
          "<div>Merchant: " + QRIS_INFO.merchant + " | NMID: " + QRIS_INFO.nmid + " (" + QRIS_INFO.terminal + ")</div>" +
          "<img src=\"" + QRIS_INFO.imageSrc + "\" alt=\"QRIS Zeevanna\" style=\"max-width:220px;margin-top:8px;border:1px solid #ccc;\" onerror=\"this.replaceWith(Object.assign(document.createElement('div'),{textContent:'File ./assets/qris-zeevanna.jpg belum ditemukan di folder assets/.'}))\" />";
      }
    }

    paymentSelect.addEventListener("change", renderPaymentHelper);
    document.getElementById("beratKg").addEventListener("input", renderPaymentHelper);
    document.getElementById("tarifKg").addEventListener("input", renderPaymentHelper);
    renderPaymentHelper();

    document.getElementById("btnHitung").addEventListener("click", () => {
      try {
        const d = getOrderData();
        const bh = d.bagiHasil;
        let teks =
          "Order: " + (d.orderId || "-") + "\n" +
          "Berat x Tarif: " + d.beratKg + " kg x Rp " + d.tarifKg.toLocaleString("id-ID") + "\n" +
          "Total Tagihan: Rp " + d.totalBilling.toLocaleString("id-ID") + "\n" +
          "Metode: " + d.paymentMethod.toUpperCase();

        if (d.paymentMethod === "cash") {
          teks += "\nUang Diterima: Rp " + d.cashReceived.toLocaleString("id-ID") +
                  "\nKembalian: Rp " + d.changeAmount.toLocaleString("id-ID");
        }

        teks += "\n--- Bagi Hasil (15/25/60) ---" +
                "\nKasir (15%): Rp " + bh.kasir.toLocaleString("id-ID") +
                "\nOperasional (25%): Rp " + bh.operasional.toLocaleString("id-ID") +
                "\nPusat (60%): Rp " + bh.pusat.toLocaleString("id-ID");

        outputBox.textContent = teks;
      } catch (err) {
        outputBox.textContent = "Error: " + err.message;
      }
    });

    document.getElementById("btnStruk").addEventListener("click", () => {
      try {
        const d = getOrderData();
        renderPaymentHelper();
        let struk =
          "=== STRUK JASA SETRIKA ===\n" +
          "ID Order: " + (d.orderId || "-") + "\n" +
          "Berat: " + d.beratKg + " kg\n" +
          "Tarif: Rp " + d.tarifKg.toLocaleString("id-ID") + "/kg\n" +
          "TOTAL: Rp " + d.totalBilling.toLocaleString("id-ID") + "\n" +
          "Metode: " + d.paymentMethod.toUpperCase();

        if (d.paymentMethod === "cash") {
          struk += "\nTunai: Rp " + d.cashReceived.toLocaleString("id-ID") +
                   "\nKembali: Rp " + d.changeAmount.toLocaleString("id-ID");
        } else {
          struk += "\nMerchant: " + QRIS_INFO.merchant +
                   "\nNMID: " + QRIS_INFO.nmid + " (" + QRIS_INFO.terminal + ")";
        }

        struk += "\n===========================";
        outputBox.textContent = struk;
      } catch (err) {
        outputBox.textContent = "Error: " + err.message;
      }
    });

    document.getElementById("btnSimpanLunas").addEventListener("click", async () => {
      try {
        await ensureCustomerAuth();
        const d = getOrderData();
        if (!d.orderId) throw new Error("ID Order wajib diisi.");

        await setDoc(
          doc(db, "serviceOrders", d.orderId),
          {
            orderId: d.orderId,
            serviceType: "setrika",
            beratKg: d.beratKg,
            tarifKg: d.tarifKg,
            totalBilling: d.totalBilling,
            paidAmount: d.paidAmount,
            paymentMethod: d.paymentMethod,
            cashReceived: d.cashReceived,
            changeAmount: d.changeAmount,
            paymentStatus: "lunas",
            status: "selesai_bayar",
            qrisNmid: d.paymentMethod === "qris" ? QRIS_INFO.nmid : null,
                    bagiHasil: d.bagiHasil,
        operators: {
          penyetrika: document.getElementById("opPenyetrika")?.value.trim() || "Tim Setrika",
          kurir: document.getElementById("opKurir")?.value.trim() || "Tim Kurir",
          admin: document.getElementById("opAdmin")?.value.trim() || "Admin Kasir",
          pic: document.getElementById("opPic")?.value.trim() || "PIC Lapangan",
        },
            paidAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );

        const bh = d.bagiHasil;
        outputBox.textContent =
          "Tersimpan & LUNAS (" + d.orderId + ") via " + d.paymentMethod.toUpperCase() + "\n" +
          "Masuk: Rp " + d.paidAmount.toLocaleString("id-ID") +
          (d.paymentMethod === "cash" ? " | Kembali: Rp " + d.changeAmount.toLocaleString("id-ID") : "") + "\n" +
          "Bagi Hasil -> Kasir: Rp " + bh.kasir.toLocaleString("id-ID") +
          " | Ops: Rp " + bh.operasional.toLocaleString("id-ID") +
          " | Pusat: Rp " + bh.pusat.toLocaleString("id-ID");
      } catch (err) {
        outputBox.textContent = "Gagal simpan: " + err.message;
      }
    });
  </script>

<!-- AI_SMART_DISPATCH_START -->
<section id="aiSmartDispatch" style="margin-top:18px;padding:16px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f8fafc;border-radius:12px;border:1px solid #334155;font-family:sans-serif;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
    <div>
      <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#38bdf8;font-weight:bold;">AI Dispatch & Live Radar</div>
      <h3 style="margin:2px 0 0;font-size:16px;">Notifikasi Pintar ke Admin (6285695272863)</h3>
    </div>
    <span style="padding:4px 10px;border-radius:999px;background:#064e3b;color:#6ee7b7;font-size:12px;font-weight:bold;">Radar Aktif</span>
  </div>

  <div id="radarNewOrderCard" style="display:none;margin-top:12px;padding:12px;background:rgba(251,191,36,0.14);border:1px solid #f59e0b;border-radius:8px;">
    <div id="radarNewOrderText" style="font-size:13px;color:#fef3c7;margin-bottom:8px;font-weight:bold;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="btnRadarSendWa" type="button" style="padding:7px 12px;background:#22c55e;color:#052e16;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px;">Kirim ke WA Admin</button>
      <button id="btnRadarDismiss" type="button" style="padding:7px 12px;background:#334155;color:#f8fafc;border:none;border-radius:6px;cursor:pointer;font-size:12px;">Tutup Alert</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
    <button id="btnAiGenerateMsg" type="button" style="padding:8px 12px;background:#38bdf8;color:#0f172a;border:none;border-radius:7px;cursor:pointer;font-weight:bold;font-size:12px;">Rakit Pesan AI</button>
    <a id="linkAiWaAdmin" href="https://wa.me/6285695272863" target="_blank" rel="noopener" style="display:inline-block;padding:8px 12px;background:#22c55e;color:#052e16;border-radius:7px;text-decoration:none;font-weight:bold;font-size:12px;">Buka WA Admin</a>
    <button id="btnAiCopyMsg" type="button" style="padding:8px 12px;background:#334155;color:#f8fafc;border:none;border-radius:7px;cursor:pointer;font-size:12px;">Salin Teks</button>
  </div>

  <div id="aiDispatchPreview" style="margin-top:12px;padding:12px;background:#020617;border:1px solid #1e293b;border-radius:8px;white-space:pre-line;font-size:12.5px;line-height:1.5;color:#e2e8f0;">
Klik "Rakit Pesan AI" untuk menyusun pesan otomatis ke admin (6285695272863), atau tunggu pesanan baru masuk lewat radar real-time.
  </div>
</section>

<script type="module">
  import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const ADMIN_WA = "6285695272863";
  const previewEl = document.getElementById("aiDispatchPreview");
  const waLinkEl = document.getElementById("linkAiWaAdmin");
  const radarCardEl = document.getElementById("radarNewOrderCard");
  const radarTextEl = document.getElementById("radarNewOrderText");

  let latestRadarOrder = null;
  let initialSnapshotDone = false;

  const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");

  function susunPesanAi(orderData = {}) {
    const orderId = orderData.orderId || (document.getElementById("orderId")?.value || "").trim() || "-";
    const status = orderData.status || "MENUNGGU_VERIFIKASI";
    const customerName = orderData.customerName || "-";
    const customerWa = orderData.customerWa || "-";
    const pickupAddress = orderData.pickupAddress || "-";
    const weight = Number(orderData.actualWeight ?? orderData.estimatedWeight ?? document.getElementById("actualWeight")?.value ?? document.getElementById("weight")?.value ?? 0);
    const tariff = Number(orderData.tariffPerKg ?? document.getElementById("tariff")?.value ?? 6000);    const total = Number(orderData.total ?? orderData.estimatedTotal ?? Math.round(weight * tariff));
    const paymentMethod = (orderData.paymentMethod || document.getElementById("paymentMethod")?.value || "CASH").toUpperCase();

    const tim = Math.round(total * 0.15);
    const ops = Math.round(total * 0.25);
    const pusat = total - tim - ops;

    const pSetrika = Math.round(tim * 0.40);
    const pKurir = Math.round(tim * 0.25);
    const pAdmin = Math.round(tim * 0.20);
    const pPic = tim - pSetrika - pKurir - pAdmin;

    const teks =
      "[AI SMART DISPATCH — SETRIKA]\n" +
      "Order: " + orderId + " | Status: " + status + "\n" +
      "Pelanggan: " + customerName + " (" + customerWa + ")\n" +
      "Alamat: " + pickupAddress + "\n" +
      "Berat: " + weight + " kg x " + rp(tariff) + " = " + rp(total) + " (" + paymentMethod + ")\n" +
      "Bagi Hasil (15/25/60): Tim " + rp(tim) + " | Ops " + rp(ops) + " | Pusat " + rp(pusat) + "\n" +
      "Tim (40/25/20/15): Setrika " + rp(pSetrika) + ", Kurir " + rp(pKurir) + ", Admin " + rp(pAdmin) + ", PIC " + rp(pPic);

    return { teks, waUrl: "https://wa.me/" + ADMIN_WA + "?text=" + encodeURIComponent(teks) };
  }

  function mainkanNadaAlert() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(784, ctx.currentTime);
      osc.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    } catch (_) {}
  }

  document.getElementById("btnAiGenerateMsg")?.addEventListener("click", () => {
    const res = susunPesanAi(latestRadarOrder || {});
    previewEl.textContent = res.teks;
    waLinkEl.href = res.waUrl;
  });

  document.getElementById("btnAiCopyMsg")?.addEventListener("click", async () => {
    const res = susunPesanAi(latestRadarOrder || {});
    previewEl.textContent = res.teks;
    waLinkEl.href = res.waUrl;
    try {
      await navigator.clipboard.writeText(res.teks);
      previewEl.textContent = res.teks + "\n\n[Teks berhasil disalin]";
    } catch (_) {}
  });

  document.getElementById("btnRadarSendWa")?.addEventListener("click", () => {
    const res = susunPesanAi(latestRadarOrder || {});
    previewEl.textContent = res.teks;
    window.open(res.waUrl, "_blank", "noopener");
  });

  document.getElementById("btnRadarDismiss")?.addEventListener("click", () => {
    radarCardEl.style.display = "none";
  });

  const dbInstance = window.db || (typeof db !== "undefined" ? db : null);
  if (dbInstance) {
    const qPending = query(collection(dbInstance, "serviceOrders"), where("status", "==", "MENUNGGU_VERIFIKASI"));
    onSnapshot(qPending, (snap) => {
      if (!initialSnapshotDone) {
        initialSnapshotDone = true;
        return;
      }
      snap.docChanges().forEach((chg) => {
        if (chg.type === "added") {
          const data = { id: chg.doc.id, ...chg.doc.data() };
          latestRadarOrder = data;
          const res = susunPesanAi(data);
          radarTextEl.textContent = "Order baru masuk: " + (data.orderId || chg.doc.id) + " — " + (data.customerName || "Pelanggan") + " (" + (data.estimatedWeight || 0) + " kg)";
          radarCardEl.style.display = "block";
          previewEl.textContent = res.teks;
          waLinkEl.href = res.waUrl;
          mainkanNadaAlert();
        }
      });
    });
  }
</script>
<!-- AI_SMART_DISPATCH_END -->

<script src="auto-jawab-ai.js"></script>
</body>
</html>
